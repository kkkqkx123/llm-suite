[package]
name = "llm-suite-decision"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Decision capability for LLM providers (OpenAI and Jev/TypeSafe styles)"

[features]
default = []
# Feature-gated mock provider for tests.
mock = []
# Feature-gated decision runner.
runner = []

[dependencies]
llm-suite-common = { version = "0.1.0", path = "../llm-suite-common" }
llm-suite-proxy = { version = "0.1.0", path = "../llm-suite-proxy" }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true, features = ["preserve_order"] }
thiserror = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true, features = ["fs"] }
tracing = { workspace = true }
base64 = "0.22"
uuid = { workspace = true }
regex = { workspace = true }
url = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
async-trait = { workspace = true }
