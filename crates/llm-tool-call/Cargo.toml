[package]
name = "llm-tool-call"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Tool-call parsing and rendering (JSON partial, XML)"

[features]
default = []
# Streaming partial-JSON argument parsing.
json-partial = []
# XML text-protocol tool-call parsing and prompt rendering.
xml = ["dep:llm-types", "dep:llm-common"]

[dependencies]
serde_json = { workspace = true }
thiserror = { workspace = true }
# Shared model/helper types used by the XML protocol parser/renderer.
llm-types = { version = "0.1.0", path = "../llm-types", optional = true }
llm-common = { version = "0.1.0", path = "../llm-common", optional = true }
