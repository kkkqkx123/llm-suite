[package]
name = "llm-suite-gateway"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Request routing gateway for LLM clients"

[features]
default = []
# Mock-client routing for tests; forwards to llm-client's mock feature.
mock = ["llm-suite-client/mock"]

[dependencies]
llm-suite-auth.workspace = true
llm-suite-client.workspace = true
llm-suite-codec.workspace = true
llm-suite-common.workspace = true
llm-suite-config.workspace = true
llm-suite-discovery.workspace = true
llm-suite-images.workspace = true
llm-suite-message.workspace = true
llm-suite-proxy.workspace = true
llm-token.workspace = true
llm-suite-types.workspace = true
dashmap = { workspace = true }
reqwest = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
llm-suite-client = { workspace = true, features = ["mock"] }
async-trait = { workspace = true }

# `mock_routing_integration` uses `LlmGateway::register_mock`, which only
# exists under the `mock` feature; skip the test target otherwise.
[[test]]
name = "mock_routing_integration"
required-features = ["mock"]
