[package]
name = "llm-gateway"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Request routing gateway for LLM clients"

[features]
default = []
# Mock-client routing for tests; forwards to llm-client's mock feature.
mock = ["llm-client/mock"]

[dependencies]
llm-client = { version = "0.1.0", path = "../llm-client" }
llm-codec = { version = "0.1.0", path = "../llm-codec" }
llm-common = { version = "0.1.0", path = "../llm-common" }
llm-config = { version = "0.1.0", path = "../llm-config" }
llm-message = { version = "0.1.0", path = "../llm-message" }
llm-proxy = { version = "0.1.0", path = "../llm-proxy" }
llm-types = { version = "0.1.0", path = "../llm-types" }
dashmap = { workspace = true }
reqwest = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
llm-client = { version = "0.1.0", path = "../llm-client", features = ["mock"] }
