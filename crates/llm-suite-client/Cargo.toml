mock = []

[dependencies]
llm-suite-codec.workspace = true
llm-suite-token.workspace = true
llm-suite-message.workspace = true
llm-suite-tool-call = { workspace = true, features = ["json-partial"] }
llm-suite-types.workspace = true
llm-suite-common.workspace = true
async-trait = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
reqwest = { workspace = true }
eventsource-stream = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
futures = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
bytes = { workspace = true }
regex = { workspace = true }
