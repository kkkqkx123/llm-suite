[package]
name = "llm-suite-auth"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Credential storage, OAuth login/refresh primitives and provider-owned authentication"

[dependencies]
llm-suite-types = { version = "0.1.0", path = "../llm-suite-types" }
llm-suite-common = { version = "0.1.0", path = "../llm-suite-common" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
async-trait.workspace = true
tracing.workspace = true
dashmap.workspace = true
# Kept in lockstep with the other reqwest lines so the workspace resolves one
# reqwest version.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
url.workspace = true
sha2.workspace = true
base64.workspace = true
rand.workspace = true

[features]
default = []
# File-backed credential store (JSON, 0600 permissions, atomic replace).
# Hosts that inject their own storage leave this off.
file-store = []

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "fs"] }
