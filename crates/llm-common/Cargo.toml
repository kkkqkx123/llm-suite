[package]
name = "llm-common"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Shared utilities for the llm-suite crates"

[dependencies]
llm-types = { version = "0.1.0", path = "../llm-types" }
chrono = { workspace = true }
uuid = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
# Kept in lockstep with llm-proxy's reqwest line so every client resolves one
# reqwest version, including the socks feature.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream", "query", "socks"] }
