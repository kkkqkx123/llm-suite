[workspace]
resolver = "2"
members = [
    "crates/llm-suite-common",
    "crates/llm-suite-decision",
    "crates/llm-suite-types",
    "crates/llm-suite-embedding",
    "crates/llm-suite-rerank",
    "crates/llm-suite-images",
    "crates/llm-suite-tool-call",
    "crates/llm-suite-token",
    "crates/llm-suite-message",
    "crates/llm-suite-codec",
    "crates/llm-suite-client",
    "crates/llm-suite-config",
    "crates/llm-suite-discovery",
    "crates/llm-suite-gateway",
    "crates/llm-suite-proxy",
    "crates/llm-suite-auth",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/kkkqkx123/llm-suite"

[workspace.dependencies]
# Internal crates. Centralized here so version/path are maintained in one
# place; member crates reference them via `name.workspace = true`.
llm-suite-auth = { version = "0.1.0", path = "crates/llm-suite-auth" }
llm-suite-common = { version = "0.1.0", path = "crates/llm-suite-common" }
llm-suite-types = { version = "0.1.0", path = "crates/llm-suite-types" }
llm-suite-proxy = { version = "0.1.0", path = "crates/llm-suite-proxy" }
llm-suite-token = { version = "0.1.0", path = "crates/llm-suite-token" }
llm-suite-message = { version = "0.1.0", path = "crates/llm-suite-message" }
llm-suite-tool-call = { version = "0.1.0", path = "crates/llm-suite-tool-call" }
llm-suite-codec = { version = "0.1.0", path = "crates/llm-suite-codec" }
llm-suite-embedding = { version = "0.1.0", path = "crates/llm-suite-embedding" }
llm-suite-rerank = { version = "0.1.0", path = "crates/llm-suite-rerank" }
llm-suite-images = { version = "0.1.0", path = "crates/llm-suite-images" }
llm-suite-client = { version = "0.1.0", path = "crates/llm-suite-client" }
llm-suite-config = { version = "0.1.0", path = "crates/llm-suite-config" }
llm-suite-discovery = { version = "0.1.0", path = "crates/llm-suite-discovery" }
llm-suite-gateway = { version = "0.1.0", path = "crates/llm-suite-gateway" }
# Alias kept for the gateway's existing `llm_token::` call sites.
llm-token = { package = "llm-suite-token", version = "0.1.0", path = "crates/llm-suite-token" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v7", "serde"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
tracing = "0.1"
dashmap = "6"
async-trait = "0.1"
# Kept in lockstep with the host workspace so both resolve one reqwest line.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream", "query", "socks"] }
eventsource-stream = "0.2"
futures = "0.3"
tokio-util = "0.7"
bytes = "1"
url = { version = "2", features = ["serde"] }
sha2 = "0.10"
base64 = "0.23"
rand = "0.10"
regex = "1"
